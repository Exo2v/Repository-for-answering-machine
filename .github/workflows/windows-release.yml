name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up 32-bit Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: "x86"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Package standalone executables
        run: |
          python -m pip install pyinstaller==5.13.2
          pyinstaller --noconfirm --clean --onefile --windowed --name ScreenAnswer answer_tray.py
          pyinstaller --noconfirm --clean --onefile --windowed --name ScreenAnswer-Diagnostic answer_tray.py

      - name: Upload standalone executables
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAnswer-Windows-32bit
          path: |
            dist/ScreenAnswer.exe
            dist/ScreenAnswer-Diagnostic.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ScreenAnswer.exe
            dist/ScreenAnswer-Diagnostic.exe
