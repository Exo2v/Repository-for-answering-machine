name: Build Windows release

# Version 1 pipeline: test the suite, freeze the `screenanswer` package
# (GUI + tray + diagnostics console) into two standalone executables,
# smoke-check the build, and attach assets to `v*` tags. The historical
# WebPull scripts and the Pix2Text OCR build are out of scope for v1.

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-v1:
    name: Build Screen Answer v1 Windows executables
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up 32-bit Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: "x86"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Headless selftest
        run: python -m screenanswer --selftest

      - name: Package standalone executables
        run: |
          python -m pip install pyinstaller==5.13.2
          pyinstaller --noconfirm --clean --onefile --windowed --name ScreenAnswer screenanswer_entry.py
          pyinstaller --noconfirm --clean --onefile --windowed --name ScreenAnswer-Diagnostic screenanswer_entry.py

      - name: Smoke-check the frozen executables
        run: |
          $proc = Start-Process -FilePath .\dist\ScreenAnswer-Diagnostic.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Write-Error "selftest failed with exit code $($proc.ExitCode)"; exit 1 }
          $proc2 = Start-Process -FilePath .\dist\ScreenAnswer-Diagnostic.exe -ArgumentList '--version' -Wait -PassThru
          if ($proc2.ExitCode -ne 0) { Write-Error "--version failed with exit code $($proc2.ExitCode)"; exit 1 }

      - name: Upload standalone executables
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAnswer-Windows-32bit
          path: |
            dist/ScreenAnswer.exe
            dist/ScreenAnswer-Diagnostic.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach assets to a v* release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ScreenAnswer.exe
            dist/ScreenAnswer-Diagnostic.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
